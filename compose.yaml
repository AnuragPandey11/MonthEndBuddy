# MonthEndBuddy local stack. From the repo root:
#   cp .env.example .env        # then set JWT_SECRET (see .env.example)
#   docker compose up --build   # app on http://localhost:8080
# Only the database, for backend development:  docker compose up -d postgres
# The compose file lives at the root so that Compose reads the root .env for ${...} values.
name: monthendbuddy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monthendbuddy
      POSTGRES_USER: ${DB_USERNAME:-monthendbuddy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-monthendbuddy}
    ports:
      # 5433 on the host so it doesn't clash with a locally installed PostgreSQL on 5432.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./infra/env/core.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/monthendbuddy
      DB_USERNAME: ${DB_USERNAME:-monthendbuddy}
      DB_PASSWORD: ${DB_PASSWORD:-monthendbuddy}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to at least 32 random bytes (openssl rand -base64 48)}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-120b}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # The nginx config lives in infra/ and is baked into the image (no bind mount: Docker Desktop on macOS
      # may not be allowed to share folders such as ~/Desktop).
      additional_contexts:
        infra: ./infra
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
