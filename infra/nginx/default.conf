# Serves the SPA and reverse-proxies /api, so the browser sees one origin (architecture §3):
# the refresh cookie is first-party and no CORS is needed. Actuator (backend:8082) is never proxied.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Strict CSP (architecture §15): scripts, styles and API calls from this origin only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The copilot streams Server-Sent Events (architecture §10.7): pass each event on as it is written, and wait
    # longer than a turn can run (45 s, plus a final model call) before giving up on a quiet stream.
    location = /api/v1/agent/chat {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # CSV uploads are limited to 5 MB by the API (architecture §8.2).
        client_max_body_size 6m;
    }

    # Hashed build assets never change; index.html must always be revalidated.
    location /assets/ {
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    # Client-side routes (/transactions, /budgets, ...) all load the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
